# ollama-pv-pvc.yaml
apiVersion: v1
kind: PersistentVolume
metadata:
  name: ollama-pv
spec:
  capacity:
    storage: 10Gi  # 根据模型大小调整，qwen:0.5b需至少2Gi
  accessModes:
    - ReadWriteOnce  # 仅允许单个节点读写（hostPath仅支持此模式）
  hostPath:
    path: /data/ollama  # 宿主机存储路径，需提前在所有节点创建
  storageClassName: manual  # 手动存储类，避免与动态供给冲突
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-pvc
  namespace: ai-services  # 与Ollama Deployment同命名空间
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: manual  # 与PV的存储类一致，确保绑定
